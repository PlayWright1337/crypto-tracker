<!DOCTYPE html>
<html lang="en" data-theme="dark"> 

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoTrack | Premium Live Market</title>
    
    <meta name="description"
        content="A beautiful, interactive cryptocurrency tracker and calculator with live market data and TradingView charts.">

    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    
    <nav class="navbar glass">
        <div class="nav-container">
            <h1 class="logo">CryptoTrack.</h1>
            <div class="nav-links">
                <button class="nav-link active" data-page="market-view">Market</button>
                <button class="nav-link" data-page="calculator-view">Calculator</button>
            </div>
            <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </div>
    </nav>

    <main class="main-content">
        
        <section id="market-view" class="page-view active">
            <header class="page-header slide-up">
                <h2 class="page-title">Live Market</h2>
                <div class="search-box glass-input">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="market-search" placeholder="Search currencies...">
                </div>
            </header>

            <div class="table-container glass slide-up" style="animation-delay: 0.1s;">
                <table class="crypto-table">
                    <thead>
                        <tr>
                            <th>Asset</th>
                            <th class="text-right">Price</th>
                            <th class="text-right">24h Change</th>
                            <th class="text-right hidden-mobile">Market Cap</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="crypto-table-body">
                        <tr>
                            <td colspan="5" class="text-center loading-state">
                                <span class="spinner"></span> Loading market data...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div id="pagination" class="pagination"></div>
        </section>

        
        <section id="calculator-view" class="page-view">
            <header class="page-header slide-up">
                <h2 class="page-title">Currency Converter</h2>
                <p class="page-subtitle">Instantly calculate crypto to fiat value.</p>
            </header>

            <div class="calc-wrapper slide-up" style="animation-delay: 0.1s;">
                
                <div class="calc-block glass">
                    <div class="block-header">
                        <span class="block-label">You Send / Have</span>
                    </div>

                    <div class="input-row">
                        <div class="amount-field">
                            <input type="number" id="calc-crypto-amount" class="huge-input" value="1" min="0"
                                step="any">
                        </div>

                        
                        <div class="custom-select-wrapper" id="crypto-custom-select">
                            <div class="custom-select-trigger glass-input">
                                <div class="trigger-content">
                                    <div class="coin-icon btc-icon">BTC</div>
                                    <span class="trigger-text">Bitcoin</span>
                                </div>
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <polyline points="6 9 12 15 18 9"></polyline>
                                </svg>
                            </div>
                            <div class="custom-select-dropdown glass">
                                <div class="dropdown-search">
                                    <input type="text" placeholder="Search coin..." id="dropdown-search-input">
                                </div>
                                <ul class="dropdown-options" id="crypto-dropdown-list">
                                    
                                </ul>
                            </div>
                        </div>
                    </div>
                    <div class="price-hint" id="crypto-price-hint">1 BTC = $0.00</div>
                </div>

                
                <div class="swap-icon-container">
                    <button id="swap-calc-btn" class="glass-btn swap-btn" aria-label="Swap currencies">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="16 3 21 8 16 13"></polyline>
                            <line x1="21" y1="8" x2="9" y2="8"></line>
                            <polyline points="8 21 3 16 8 11"></polyline>
                            <line x1="3" y1="16" x2="15" y2="16"></line>
                        </svg>
                    </button>
                </div>

                
                <div class="calc-block glass">
                    <div class="block-header">
                        <span class="block-label">You Get / Worth</span>
                    </div>

                    <div class="input-row">
                        <div class="amount-field fiat-field">
                            <span class="fiat-symbol js-fiat-symbol">$</span>
                            <input type="number" id="calc-fiat-amount" class="huge-input" value="0.00" min="0"
                                step="any">
                        </div>

                        <div class="custom-select-wrapper" id="fiat-custom-select">
                            <div class="custom-select-trigger glass-input">
                                <div class="trigger-content">
                                    <div class="fiat-flag">рџ‡єрџ‡ё</div>
                                    <span class="trigger-text">USD</span>
                                </div>
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <polyline points="6 9 12 15 18 9"></polyline>
                                </svg>
                            </div>
                            <div class="custom-select-dropdown glass">
                                <ul class="dropdown-options" id="fiat-dropdown-list">
                                    
                                </ul>
                            </div>
                        </div>
                    </div>
                    <div class="price-hint">No hidden fees</div>
                </div>
            </div>
        </section>
    </main>

    
    <div id="chart-modal" class="modal">
        <div class="modal-backdrop"></div>
        <div class="modal-content glass">
            <div class="modal-header">
                <h3 id="modal-coin-title">Bitcoin Chart</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div id="tradingview-widget-container" class="chart-container">
                
            </div>
        </div>
    </div>

    
    
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    
    <script src="js/app.js"></script>
</body>

</html>
